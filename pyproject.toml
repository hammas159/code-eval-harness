[project]
name = "code-eval-harness"
version = "0.1.0"
description = "The same generations score differently depending only on how the code is extracted. Measuring how much a code benchmark's number depends on its harness."
requires-python = ">=3.11"
dependencies = ["pandas>=2.2", "pyarrow>=15"]

[project.optional-dependencies]
fetch = ["huggingface_hub>=0.34"]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.16,<0.17"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.ruff]
line-length = 100
